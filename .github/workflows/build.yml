name: Extract and Build APK

on:
  push:
    branches: [main, master]
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Source ZIP filename in repository root (leave blank to auto-detect the newest ZIP)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and extract source ZIP
        id: source
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"

          if [[ -n "${REQUESTED_ZIP:-}" ]]; then
            ZIP_PATH="$GITHUB_WORKSPACE/$REQUESTED_ZIP"
            if [[ ! -f "$ZIP_PATH" ]]; then
              echo "ERROR: source_zip '$REQUESTED_ZIP' was not found in the repository root." >&2
              echo "ZIP files in repository root:" >&2
              find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' >&2 || true
              exit 1
            fi
          else
            ZIP_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
            if [[ -z "$ZIP_PATH" ]]; then
              echo "ERROR: No source ZIP found in the repository root. Upload your Android project ZIP and rerun." >&2
              exit 1
            fi
          fi

          echo "Using source ZIP: $(basename "$ZIP_PATH")"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: Extracted ZIP does not contain settings.gradle or settings.gradle.kts." >&2
            echo "Extracted files (first 100):" >&2
            find "$RUNNER_TEMP/source" -maxdepth 5 -type f | head -n 100 >&2 || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug and release APKs
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            gradle assembleDebug assembleRelease --no-daemon
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: crt-overlay-apks
          if-no-files-found: error
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
