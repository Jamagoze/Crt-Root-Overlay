name: Build crt3d module

on:
  push:
    paths:
      - project_light_and_shadows.zip
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: unzip -o project_light_and_shadows.zip

      - name: Build Zygisk module
        run: bash zygisk-module/build.sh

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: crt3d-zygisk
          path: dist/crt3d-zygisk.zip
